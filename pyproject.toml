[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-prediction-engine"
version = "0.1.0"
description = "Causal coherence forecasts, frozen comparisons, reproducible audits and revision records"
requires-python = ">=3.10"
authors = [{name = "Matthew Chenoweth Wright"}]
dependencies = []

[tool.setuptools]
packages = ["cpe"]

[tool.setuptools.package-data]
cpe = ["registry/*.json"]
